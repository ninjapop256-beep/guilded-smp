name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      # Paper 26.2 requires Java 25; build and test on the minimum supported JDK.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Build, test and package
        run: ./gradlew --no-daemon build dist

      - name: Upload plugin and resource pack
        uses: actions/upload-artifact@v7
        with:
          name: GuildedSMP
          path: dist/*
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
