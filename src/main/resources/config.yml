# =============================================================================
#  Guilded SMP - configuration
#
#  * Apply changes with /guilded reload.
#  * Runtime data (homes, spawn, mutes, identity pins) lives in
#    plugins/GuildedSMP/data/ and is never overwritten by edits to this file.
#  * New settings added by plugin updates are merged in automatically; your
#    values are kept and a backup (config.yml.bak-<time>) is written first.
#  * Invalid values are reported in the console and replaced by safe defaults.
# =============================================================================
config-version: 1

# -----------------------------------------------------------------------------
# Operator protection
# -----------------------------------------------------------------------------
operator-protection:
  # Keep the accounts below opped. Set to false (then /guilded reload) when you
  # legitimately need to de-op one of them.
  enabled: true
  # Exact Minecraft usernames. Optionally pin an account with "Name:uuid".
  # Name-only entries are pinned to the first UUID that joins with that name on
  # a server that verifies accounts (online-mode or a verified proxy).
  protected-players:
    - Itzbreadloaf
    - FelixSyn
  # Cancel "/deop <protected name>" from players, console, RCON and command blocks.
  block-deop-commands: true
  # How often op status is re-checked (seconds, 5-3600). op is only re-written
  # when it was actually lost, so this never causes repeated disk writes.
  check-interval-seconds: 30
  # DANGEROUS: also op name-only entries on an offline-mode server without a
  # verified proxy (anyone can join with any name there).
  allow-offline-mode: false
  # Give the protected accounts the guilded.creator permission tier.
  grant-creator-permission: true

# -----------------------------------------------------------------------------
# Combat tagging
# -----------------------------------------------------------------------------
combat:
  # How long a PvP hit keeps both players in combat (seconds).
  tag-duration-seconds: 20
  # ACTION_BAR, BOSS_BAR, BOTH or NONE
  display: ACTION_BAR
  # MiniMessage format. <seconds> = remaining seconds.
  display-format: "<red><bold>⚔ IN COMBAT</bold></red> <dark_gray>—</dark_gray> <white><seconds>s</white>"
  boss-bar-color: RED
  notify-on-tag: true
  notify-on-expire: true
  # Block teleports caused by commands (e.g. other plugins' /warp, /back, /tp)
  # for tagged players. This plugin's own /spawn, /home and /tpa are always blocked.
  block-command-teleports: true
  # Block nether/end portal use while tagged.
  block-portals: false
  # Extra commands (without "/") that tagged players cannot use.
  blocked-commands:
    - back
    - warp
    - warps
    - rtp
    - wild
    - tpahere
    - tpaall
  combat-log:
    enabled: true
    # KILL = the player dies when they log out in combat. The server's normal
    # death rules apply (items drop once, or are kept with keepInventory).
    # NONE = no penalty.
    penalty: KILL
    broadcast: true
    # Which disconnects count: DISCONNECTED, TIMED_OUT, KICKED, ERRONEOUS_STATE.
    # Server shutdowns and restarts never count.
    penalize-reasons:
      - DISCONNECTED
      - TIMED_OUT

# -----------------------------------------------------------------------------
# Teleports (/spawn, /home, /tpa)
# -----------------------------------------------------------------------------
teleport:
  # Seconds to stand still before teleporting (0 = instant).
  warmup-seconds: 3
  cancel-on-move: true
  cancel-on-damage: true

tpa:
  request-timeout-seconds: 60
  # Seconds between sending /tpa requests.
  cooldown-seconds: 30

# -----------------------------------------------------------------------------
# Homes
# -----------------------------------------------------------------------------
homes:
  default-limit: 3
  # Higher limits granted by permission guilded.homes.limit.<name>
  limits:
    vip: 5
    mvp: 10
  # Home names: lowercase letters, digits, _ and -, up to this length.
  max-name-length: 16

# -----------------------------------------------------------------------------
# Spawn
# -----------------------------------------------------------------------------
spawn:
  # Send players to spawn on their very first join.
  teleport-on-first-join: true
  # Respawn at spawn when a player has no bed or respawn anchor.
  respawn-at-spawn-without-bed: true

# -----------------------------------------------------------------------------
# Spawn protection (a square centred on the spawn point)
# -----------------------------------------------------------------------------
spawn-protection:
  # Radius used the first time a spawn is set (radius 100 = 201x201 blocks).
  default-radius: 100
  max-radius: 5000
  # Turn protection on automatically the first time /spawn set is used.
  enable-on-first-spawn-set: true
  # No player-vs-player damage, fire, knockback, harmful potions or fishing-rod
  # pulls when either player is inside.
  block-pvp: true
  # Hostile mobs cannot hurt players who are inside.
  block-hostile-mob-damage: true
  # Stop hostile mobs spawning inside for these reasons.
  block-hostile-spawns: true
  hostile-spawn-reasons:
    - NATURAL
    - JOCKEY
    - REINFORCEMENTS
    - PATROL
    - VILLAGE_INVASION
  # Hostile mobs can't target players who are inside.
  block-hostile-targeting: true
  # Remove hostile mobs that wander in, but only ones that would despawn anyway
  # (no name tag, not leashed, not persistent, not bosses).
  remove-wandering-hostiles: true
  hostile-sweep-interval-seconds: 5
  # Combat-tagged players can't walk, ride, fly or teleport into the zone.
  # Players already inside can always leave.
  block-combat-tagged-entry: true
  # Visible border. Uses display entities: no world blocks are ever changed.
  outline:
    enabled: true
    block: RED_WOOL
    # Height of the line in blocks (0.0625 - 4).
    height: 1.0
    # Always fully lit, so it is visible at night.
    full-bright: true
    # Client view-distance multiplier for the line (1.0 = default).
    view-range: 1.0
    # Re-check ground height under the line every N seconds (0 = never).
    refresh-interval-seconds: 60
    # Hard cap on display entities used by the line.
    max-entities: 2048

# -----------------------------------------------------------------------------
# Legendary weapons
# -----------------------------------------------------------------------------
legendaries:
  # Effects only proc on fully charged swings (no spam-click procs).
  require-full-attack-charge: true
  # How often held-weapon effects are refreshed (ticks).
  passive-check-interval-ticks: 10
  # Length of each refreshed held effect (ticks). Removed when you switch away.
  passive-effect-duration-ticks: 60
  # Anvil: repair with netherite ingots / a plain netherite sword.
  allow-anvil-repair: true
  # Anvil: apply enchanted books.
  allow-anvil-enchanted-books: true
  # Anvil: rename legendaries.
  allow-rename: false
  held-particles: true
  # Broadcast when someone crafts a legendary.
  announce-crafts: true
  inferno-blade:
    ignite-chance: 0.25
    ignite-seconds: 4
    fire-resistance-while-held: true
  frostbite:
    slowness-chance: 0.30
    slowness-seconds: 3
    # 0 = Slowness I, 1 = Slowness II ...
    slowness-amplifier: 1
    speed-while-held: true
    # 0 = Speed I
    speed-amplifier: 0
  void-reaper:
    weakness-chance: 0.25
    weakness-seconds: 4
    weakness-amplifier: 0
    kill-strength-seconds: 8
    # 0 = Strength I
    kill-strength-amplifier: 0
    # PLAYERS = only direct melee kills of players.
    # PLAYERS_AND_HOSTILES = also hostile mobs.
    kill-trigger: PLAYERS

# -----------------------------------------------------------------------------
# Legendary recipes (crafting table, 3x3)
#   Ingredients: guildedsmp:<ingredient id> or a vanilla item id.
#   Each letter in the shape uses one item. Mirrored layouts also work.
# -----------------------------------------------------------------------------
recipes:
  enabled: true
  # Unlock the recipes in every player's recipe book on join.
  discover-on-join: true
  inferno-blade:
    shape: ["CEC", "RSR", "PM "]
    ingredients:
      C: guildedsmp:inferno_core
      E: guildedsmp:ember_crystal
      R: minecraft:blaze_rod
      S: minecraft:netherite_sword
      P: minecraft:blaze_powder
      M: minecraft:magma_block
  frostbite:
    shape: ["FZF", "PSP", "BH "]
    ingredients:
      F: guildedsmp:frost_core
      Z: guildedsmp:frozen_crystal
      P: minecraft:packed_ice
      S: minecraft:netherite_sword
      B: minecraft:blue_ice
      H: minecraft:prismarine_shard
  void-reaper:
    shape: ["VHV", "OSO", "EN "]
    ingredients:
      V: guildedsmp:void_shard
      H: guildedsmp:void_heart
      O: minecraft:obsidian
      S: minecraft:netherite_sword
      E: minecraft:ender_eye
      N: minecraft:nether_star

# -----------------------------------------------------------------------------
# Ingredient drops (chance per kill, 0.0 - 1.0)
# -----------------------------------------------------------------------------
drops:
  enabled: true
  # Only kills credited to a player drop ingredients.
  require-player-kill: true
  # Added chance per Looting level on the killer's weapon.
  looting-bonus-per-level: 0.01
  # Boss drops go straight into the killer's inventory.
  boss-drops-to-killer: true
  table:
    inferno_core:
      BLAZE: 0.05
    ember_crystal:
      MAGMA_CUBE: 0.03
      GHAST: 0.10
    frost_core:
      STRAY: 0.06
    frozen_crystal:
      STRAY: 0.02
      POLAR_BEAR: 0.08
    void_shard:
      ENDERMAN: 0.015
      SHULKER: 0.08
    void_heart:
      ENDER_DRAGON: 1.0
      WARDEN: 0.25

# -----------------------------------------------------------------------------
# TAB list. The header brand "GUILDED SMP" is fixed: GUILDED = #00FFFF,
# SMP = #000000 (exact colours, no gradient).
# -----------------------------------------------------------------------------
tablist:
  enabled: true
  # How often ping / player counts are refreshed (ticks; 40 = 2 seconds).
  # Only changed footers are sent.
  refresh-interval-ticks: 40
  # Give the black "SMP" a light text shadow so it is readable on the dark TAB
  # background. The letters themselves stay #000000.
  smp-shadow: true
  smp-shadow-color: "#A0A0A0"
  # Extra MiniMessage lines under the brand, e.g. "<gray>Season 1</gray>".
  header-extra-lines: []
  # <ping> (coloured by quality), <online>, <max>
  footer-format: "<gray>Ping: <ping> <dark_gray>|</dark_gray> Players Online: <white><online>/<max></white></gray>"
  ping-good-ms: 80
  ping-okay-ms: 160
  # If another TAB plugin (TAB, CMI, ...) is installed, leave the TAB list to it.
  disable-on-conflict: true

# -----------------------------------------------------------------------------
# Resource pack (optional). Upload GuildedSMP-ResourcePack-<version>.zip
# somewhere that serves a direct download, then fill in url and sha1.
# The sha1 is printed by the build and stored next to the ZIP.
# -----------------------------------------------------------------------------
resource-pack:
  enabled: false
  url: ""
  sha1: ""
  # Kick players who decline (vanilla client behaviour when required).
  required: false
  prompt: "<#00FFFF>Guilded SMP</#00FFFF> <gray>uses a custom resource pack for legendary items.</gray>"
  send-delay-ticks: 20
  # AUTO = custom sounds for players who loaded the pack, vanilla for others.
  # CUSTOM = always custom, VANILLA = always vanilla.
  sounds: AUTO

# -----------------------------------------------------------------------------
# Moderation
# -----------------------------------------------------------------------------
moderation:
  # Commands muted players cannot use (without "/").
  muted-blocked-commands: [msg, tell, w, whisper, me, say, r, reply, mail, teammsg, tm]
  # Longest allowed /tempban.
  max-tempban: "365d"

# -----------------------------------------------------------------------------
